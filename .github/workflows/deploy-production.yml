name: Deploy – Production

on:
  workflow_dispatch:
    inputs:
      api_image_tag:
        description: 'API image tag (short SHA from staging build, e.g. sha-abc1234)'
        required: true
      web_image_tag:
        description: 'Web image tag (short SHA from staging build)'
        required: true
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true

env:
  AWS_REGION: eu-west-1

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "Confirmation input was '${{ github.event.inputs.confirm }}', expected 'DEPLOY'"
          exit 1

  terraform-apply:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - run: terraform init
        working-directory: infra/production
      - run: terraform apply -auto-approve
        working-directory: infra/production
        env:
          TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_acm_certificate_arn: ${{ secrets.PROD_ACM_CERT_ARN }}
          TF_VAR_api_image: ${{ secrets.ECR_REGISTRY }}/eart-production-api:${{ github.event.inputs.api_image_tag }}
          TF_VAR_web_image: ${{ secrets.ECR_REGISTRY }}/eart-production-web:${{ github.event.inputs.web_image_tag }}

  db-migrate:
    name: Run DB migrations (production)
    runs-on: ubuntu-latest
    needs: terraform-apply
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run migrations via ECS task
        run: |
          aws ecs run-task \
            --cluster eart-production \
            --task-definition eart-production-api \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PROD_PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.PROD_ECS_SG_ID }}]}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/db/migrate.js"]}]}'

  deploy-ecs:
    name: Deploy ECS services (production)
    runs-on: ubuntu-latest
    needs: db-migrate
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws ecs update-service --cluster eart-production --service eart-production-api --force-new-deployment
      - run: aws ecs update-service --cluster eart-production --service eart-production-web --force-new-deployment
      - run: |
          aws ecs wait services-stable --cluster eart-production --services eart-production-api eart-production-web
